amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: likelihood_field
    max_beams: 120
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    random_seed: -1
    resample_interval: 1
    robot_model_type: nav2_amcl::DifferentialMotionModel
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    introspection_mode: disabled
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_merged
    set_initial_pose: true
    initial_pose:
      x: 0.734
      y: 0.95
      z: 0.0
      yaw: 3.141593
bt_navigator:
  ros__parameters:
    global_frame: mission_map
    robot_base_frame: rotation_center
    odom_topic: /odometry/filtered
    bt_loop_duration: 10
    filter_duration: 0.3
    default_server_timeout: 20
    default_cancel_timeout: 50
    wait_for_service_timeout: 1000
    introspection_mode: disabled
    navigators:
    - navigate_to_pose
    - navigate_through_poses
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
      enable_groot_monitoring: false
      groot_server_port: 1667
      search_window: 2.0
    navigate_through_poses:
      plugin: nav2_bt_navigator::NavigateThroughPosesNavigator
      enable_groot_monitoring: false
      groot_server_port: 1669
      search_window: 2.0
    bt_search_directories:
    - $(find-pkg-share nav2_bt_navigator)/behavior_trees
    error_code_name_prefixes:
    - assisted_teleop
    - backup
    - compute_path
    - dock_robot
    - drive_on_heading
    - follow_object
    - follow_path
    - nav_thru_poses
    - nav_to_pose
    - route
    - spin
    - smoother
    - undock_robot
    - wait
    default_nav_to_pose_bt_xml: /home/pa4/git/lv2_next_module/261031_1325_nav2/config/bt/navigate_to_pose_replan_only_after_failure.xml
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    path_handler_plugins:
    - PathHandler
    use_realtime_priority: false
    speed_limit_topic: speed_limit
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.25
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.025
      yaw_goal_tolerance: 0.05
      path_length_tolerance: 1.0
    PathHandler:
      plugin: nav2_controller::FeasiblePathHandler
      prune_distance: 2.0
      enforce_path_inversion: true
      enforce_path_rotation: true
      inversion_xy_tolerance: 0.03
      inversion_yaw_tolerance: 0.2
      minimum_rotation_angle: 0.25
      reject_unit_path: false
    FollowPath:
      plugin: nav2_rotation_shim_controller::RotationShimController
      angular_dist_threshold: 0.25
      angular_disengage_threshold: 0.05
      forward_sampling_distance: 0.03
      rotate_to_heading_angular_vel: 0.5
      max_angular_accel: 0.8
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: true
      rotate_to_heading_once: false
      closed_loop: false
      use_path_orientations: true
      primary_controller:
        plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
        max_linear_vel: 0.12
        min_linear_vel: -0.1
        max_angular_vel: 0.8
        max_linear_accel: 0.5
        max_linear_decel: 0.5
        max_angular_accel: 1.5
        max_angular_decel: 1.5
        lookahead_dist: 0.2
        min_lookahead_dist: 0.15
        max_lookahead_dist: 0.4
        lookahead_time: 1.5
        use_velocity_scaled_lookahead_dist: false
        use_fixed_curvature_lookahead: true
        curvature_lookahead_dist: 0.3
        min_approach_linear_velocity: 0.04
        approach_velocity_scaling_dist: 0.3
        use_regulated_linear_velocity_scaling: true
        regulated_linear_scaling_min_radius: 0.4
        regulated_linear_scaling_min_speed: 0.04
        use_cost_regulated_linear_velocity_scaling: false
        use_collision_detection: false
        max_allowed_time_to_collision_up_to_carrot: 1.0
        allow_obstacle_checking_beyond_goal: false
        allow_reversing: true
        use_rotate_to_heading: false
        interpolate_curvature_after_goal: true
        use_cancel_deceleration: false
    odom_topic: /odometry/filtered
    enable_stamped_cmd_vel: true
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: rotation_center
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.0125
      plugins:
      - obstacle_layer
      - objects_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 6.0
        inflation_radius: 0.45
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      always_send_full_costmap: true
      introspection_mode: disabled
      footprint: '[[-0.0764, -0.171], [-0.0764, 0.171], [0.3416, 0.171], [0.3416,
        -0.171]]'
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan_front scan_rear
        scan_front:
          topic: /scan_front_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
        scan_rear:
          topic: /scan_rear_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      objects_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map_objects
        map_subscribe_transient_local: true
      use_maximum: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: mission_map
      robot_base_frame: rotation_center
      resolution: 0.025
      track_unknown_space: true
      plugins:
      - static_layer
      - objects_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan_front scan_rear
        scan_front:
          topic: /scan_front_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
        scan_rear:
          topic: /scan_rear_filtered
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 6.0
        inflation_radius: 0.45
      always_send_full_costmap: true
      introspection_mode: disabled
      footprint: '[[-0.0764, -0.171], [-0.0764, 0.171], [0.3416, 0.171], [0.3416,
        -0.171]]'
      objects_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_topic: /map_objects
        map_subscribe_transient_local: true
      use_maximum: true
      footprint_padding: 0.04
map_server:
  ros__parameters:
    frame_id: mission_map
    introspection_mode: disabled
map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
    introspection_mode: disabled
planner_server:
  ros__parameters:
    allow_partial_planning: false
    expected_planner_frequency: 20.0
    planner_plugins:
    - GridBased
    costmap_update_timeout: 1.0
    introspection_mode: disabled
    GridBased:
      plugin: nav2_smac_planner::SmacPlannerLattice
      lattice_filepath: /home/pa4/git/lv2_next_module/261031_1325_nav2/config/lattice_straight_rot_0025_nomid.json
      allow_reverse_expansion: true
      reverse_penalty: 2.0
      rotation_penalty: 5.0
      change_penalty: 0.0
      non_straight_penalty: 1.05
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 0.01
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      tolerance: 0.05
      allow_unknown: false
      max_iterations: 5000000
      max_on_approach_iterations: 1000000
      max_planning_time: 15.0
      terminal_checking_interval: 5000
      cache_obstacle_heuristic: false
      lookup_table_size: 6.0
      smooth_path: false
      debug_visualizations: false
      use_quadratic_cost_penalty: false
      downsample_obstacle_heuristic: true
      coarse_search_resolution: 1
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    - route_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      refinement_num: 2
      enforce_path_inversion: true
      do_refinement: true
    route_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      refinement_num: 5
      enforce_path_inversion: false
      do_refinement: true
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    spin:
      plugin: nav2_behaviors::Spin
    backup:
      plugin: nav2_behaviors::BackUp
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.1
    drive_on_heading:
      plugin: nav2_behaviors::DriveOnHeading
      acceleration_limit: 2.5
      deceleration_limit: -2.5
      minimum_speed: 0.1
    wait:
      plugin: nav2_behaviors::Wait
    assisted_teleop:
      plugin: nav2_behaviors::AssistedTeleop
    local_frame: odom
    global_frame: mission_map
    robot_base_frame: rotation_center
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5
    min_rotational_vel: 0.19
    rotational_acc_lim: 1.0
    enable_stamped_cmd_vel: true
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity:
    - 0.2
    - 0.0
    - 0.8
    min_velocity:
    - -0.1
    - 0.0
    - -0.8
    max_accel:
    - 0.5
    - 0.0
    - 3.2
    max_decel:
    - -0.5
    - 0.0
    - -3.2
    odom_topic: /odometry/filtered
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: true
collision_monitor:
  ros__parameters:
    enabled: true
    base_frame_id: rotation_center
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel_cm
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons:
    - FootprintApproach
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: false
      enabled: true
    observation_sources:
    - scan_front
    - scan_rear
    enable_stamped_cmd_vel: true
    scan_front:
      type: scan
      topic: /scan_front_filtered
      enabled: true
    scan_rear:
      type: scan
      topic: /scan_rear_filtered
      enabled: true
map_objects_server:
  ros__parameters:
    topic_name: map_objects
    frame_id: mission_map
