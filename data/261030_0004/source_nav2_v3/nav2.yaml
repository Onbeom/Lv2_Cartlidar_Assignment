planner_server:
  ros__parameters:
    planner_plugins:
    - GridBased
    expected_planner_frequency: 2.0
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.05
      use_astar: true
      allow_unknown: false
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    enable_stamped_cmd_vel: true
    odom_topic: /odom
    failure_tolerance: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins:
    - progress_checker
    goal_checker_plugins:
    - goal_checker
    controller_plugins:
    - FollowPath
    path_handler_plugins:
    - PathHandler
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 30.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.15
      stateful: true
    PathHandler:
      plugin: nav2_controller::FeasiblePathHandler
      prune_distance: 2.0
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      max_linear_vel: 0.15
      min_linear_vel: 0.02
      max_angular_vel: 0.6
      lookahead_dist: 0.35
      use_velocity_scaled_lookahead_dist: false
      use_rotate_to_heading: true
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      min_distance_to_obstacle: 0.05
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_speed: 0.03
      max_linear_accel: 0.3
      max_linear_decel: 0.5
      max_angular_accel: 1.0
global_costmap:
  global_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      resolution: 0.05
      footprint: '[[-0.226,-0.168],[-0.226,0.168],[0.264,0.168],[0.264,-0.168]]'
      footprint_padding: 0.02
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.2
      track_unknown_space: true
      plugins:
      - static_layer
      - nvblox_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nvblox_map_slice_topic: /nvblox_probe/combined_map_slice
        nav2_costmap_global_frame: map
        max_obstacle_distance: 0.6
        inflation_distance: 0.2
      always_send_full_costmap: true
      rolling_window: false
local_costmap:
  local_costmap:
    ros__parameters:
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      resolution: 0.05
      footprint: '[[-0.226,-0.168],[-0.226,0.168],[0.264,0.168],[0.264,-0.168]]'
      footprint_padding: 0.02
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.2
      track_unknown_space: true
      plugins:
      - static_layer
      - nvblox_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      nvblox_layer:
        plugin: nvblox::nav2::NvbloxCostmapLayer
        enabled: true
        nvblox_map_slice_topic: /nvblox_probe/combined_map_slice
        nav2_costmap_global_frame: map
        max_obstacle_distance: 0.6
        inflation_distance: 0.2
      always_send_full_costmap: true
      rolling_window: true
      width: 4
      height: 3
