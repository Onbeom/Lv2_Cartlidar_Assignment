rear_obstacle:
  ros__parameters:
    depth_max_m: 3.0
    depth_min_m: 0.1
    depth_scale: 0.001
    depth_topic: /top_camera_rear/aligned_depth_to_color/image_raw
    distance_topic: /perception/rear_obstacle/distance
    info_topic: /top_camera_rear/color/camera_info
    min_points: 20
    near_m: 0.0
    publish_rate: 10.0
    range_m: 1.0
    reason_topic: /perception/rear_obstacle/reason
    release_count: 3
    release_m: 0.5
    stale_s: 0.5
    stop_m: 0.4
    stop_topic: /perception/rear_obstacle
    stride: 2
    target_frame: base_footprint
    x_edge: -0.2285
    y_half: 0.2176
    z_max: 0.45
    z_min: 0.02
